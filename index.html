<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#07152a" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>Wing Blocks — Wings Studios</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background:
          radial-gradient(circle at 50% 18%, #173b67 0%, #07152a 38%, #040914 100%);
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
      }
      #game {
        position: relative;
        width: 100%;
        height: 100%;
      }
      #game canvas {
        display: block;
        box-shadow: 0 0 80px rgb(0 0 0 / 35%);
      }
      #boot-status {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        box-sizing: border-box;
        width: min(340px, calc(100% - 32px));
        padding: 30px 24px;
        color: #fff8df;
        border: 1px solid rgb(240 199 94 / 55%);
        border-radius: 16px;
        background: rgb(7 21 42 / 92%);
        box-shadow: 0 18px 60px rgb(0 0 0 / 35%);
        font-family: "Courier New", Courier, monospace;
        text-align: center;
      }
      #boot-status h1 {
        margin: 8px 0 14px;
        font: 700 28px/1 "Trebuchet MS", sans-serif;
        letter-spacing: 2px;
      }
      .boot-mark {
        color: #f0c75e;
        font-size: 28px;
      }
      .boot-loading,
      .boot-file p {
        margin: 0;
        color: #aec8e8;
        font-size: 12px;
        line-height: 1.7;
      }
      .boot-file {
        display: none;
      }
      .boot-file code {
        display: block;
        margin: 18px 0 8px;
        padding: 12px;
        color: #ffedac;
        border-radius: 8px;
        background: #040914;
        user-select: all;
      }
      .boot-file a {
        display: inline-block;
        margin-top: 18px;
        padding: 12px 18px;
        color: #07152a;
        border-radius: 24px;
        background: #f0c75e;
        font-weight: 700;
        text-decoration: none;
      }
      html[data-launch-mode="file"] .boot-loading {
        display: none;
      }
      html[data-launch-mode="file"] .boot-file {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="game">
      <section id="boot-status" aria-live="polite">
        <div class="boot-mark">◆</div>
        <h1>WING BLOCKS</h1>
        <p class="boot-loading">A preparar o jogo…</p>
        <div class="boot-file">
          <p>Este jogo precisa do servidor local do Vite. O arquivo <strong>index.html</strong> não deve ser aberto diretamente.</p>
          <code>npm start</code>
          <p>Ou dê duplo clique em <strong>Abrir Wing Blocks.command</strong>.</p>
          <a href="http://127.0.0.1:5173/">Abrir jogo local</a>
        </div>
      </section>
    </div>
    <script>
      if (window.location.protocol === "file:") {
        document.documentElement.dataset.launchMode = "file";
        fetch("http://127.0.0.1:5173/", { mode: "no-cors", cache: "no-store" })
          .then(() => window.location.replace("http://127.0.0.1:5173/"))
          .catch(() => undefined);
      }
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
